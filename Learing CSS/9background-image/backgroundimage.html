<!DOCTYPE html>
<html lang="en">
<head>
    <title> background-image</title>
    <style>
        #pic{
             background-image   : url(talhapic.jpg);
             width              :56px              ;
             height             :55px              ;
             background-size    : contain          ;/*come in whatever the container contain*/
             background-repeat  : no-repeat        ;
             background-position: top              ;
            ;}

    </style>
</head>

<body>
    <div id="pic">TALHA</div>
</body>

</html>
