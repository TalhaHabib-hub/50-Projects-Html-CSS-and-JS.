<!DOCTYPE html>
<html lang="en">
<head>
    <title>Color Property</title>     <!-- Including styles(internal styling)internal of head.
                                            Embedded CSS        :styles are placed with in <style> tags in HTML head section.
                                            Cleaner than inline :more organized compared to inline styles                   .
                                            Reusable styles     :allows for some reuse of styles across the page            .
                                                                 CSS and HTML tage will not be intangeled )                 .-->
    <style>
        h1{
            color: rgb(44, 175, 18);
          }  
        p{
            color: rgb(30, 127, 77);
         }  
        </style>
</head>
<body>
    <h1                          >This is the heading     </h1>
    <h1                          >This is second heading  </h1>
    <h1 style="color: crimson;">This is last heading    </h1>
    <p>
        Lorem ipsum dolor sit, amet consectetur adipisicing anditiis 
        animi dolores fuga maxime ea exercitationem. Similique, non totam
        laboriosam vel tempore repellendus nam.
    </p>
</body>
</html>
<!-- h1{
            color: red;
        }                  ....:h1    ==> selector :The HTML Element you want to style                                  .
                               :color ==> Property :The attribute you want to change(like font,color etc)               .
                               :red   ==> value    :The specific style you want apply to the propety(like red,bold,etc) .

Color Property
==> definition :The CSS color property defines the text color or forground color in an HTML element.
==> Enhancement:use it to emphasize sections ans elevate webpage aesthatics                        .-->
