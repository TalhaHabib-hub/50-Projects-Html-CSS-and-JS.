<!DOCTYPE html>
<html lang="en">
<head>
    <title>ID and CLASS selectors</title>
    <style>
        #top_heading{ color: red   ;}
        #tal        { color: green ;}
        #trs        { color: purple;}
        .article    { color: orange;}
        
    </style>
</head>
<body>
    <h1  class="article">Id and Class                                                                   </h1 >
    <p   class="article">Lorem ipsum dolor sit amet consectetur adipisicing elit. Odit nihil quas autem.</p  >
    <div class="article">kicha sus la zan tapa niki wa                                                  </div>

    <div id="trs">Tahir khan</div>   
    <h2  id="tal">TALHA     </h2 >
</body>
</html>
<!--SELECTORS(ID and CLASS)
       ID property              :assigns a unique identefier to asingle HTML element                                                .
       class Property           :allows grouping of multiple HTML elements to style them collectively                               .
       reusable Classes         :Class property can be reused across different elements for consistent styling                      .
       speciffity and targeting :both properties assist in targeting specific elements or groups of elements for    precise styling .-->
<!--ID selectors
       Unique identifier        :targets a specific element with a unique ID attribute                                              .
       Syantax                  :use the (#)symbol                                                                                  .
       single use               :Each ID should be use once per pagefor uniqueness                                                  .
       specific targeting       :Ideal for individual,distinct elements                                                             .-->
<!--class selector
       Group styling            :Allows styling of multiple elements grouped under similar class                                    .
       syntax                   :utilizes the dot(.)symbol                                                                          .
       Reuseable                :can be use on multiple elements for consistenyt styling                                            .
       Versatility              :ideal for applying styles to a category of elements                                                .-->
