<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .box   {height: 63px;width: 123px;}
        #box1  {color: rgb(216, 229, 240);   background-color: rgb(9, 193, 255  );  text-decoration:underline   ;    text-align: center ;    text-decoration-style: dashed;       text-decoration-color: purple              ;text-transform: uppercase   ;  }
        #box2  {color: rgb(255, 225, 0  );   background-color: rgb(106, 212, 106);  text-decoration:overline    ;    text-align: left   ;    text-decoration-style: dotted;       text-decoration-color: blue                ;text-transform: capitalize  ;  }
        #box8  {color: rgb(9, 235, 73   );   background-color: rgb(248, 13, 13  );  text-decoration:line-through;    text-align: right  ;    text-decoration-style: double;       text-decoration-color: rgb(222, 219, 217)  ;text-transform: lowercase   ;  }
        #box4  {color: rgb(54, 57, 55   );   background-color: rgb(249, 249, 95 );  text-decoration:overline    ;    text-align: justify;    text-decoration-style: solid ;       text-decoration-color: rgb(11, 11, 10)     ;text-transform: none        ;  }
        #linkkk{                                                                        text-decoration:overline     ;                            text-decoration-style: wavy  ;       text-decoration-color: rgb(255, 73, 104)  ;text-transform: capitalize ;  }
    </style>
</head>
<body>
    <div id="box1"class="box">B0X #1</div>
    <div id="box2"class="box">B0X #2</div>
    <div id="box8"class="box">B0X #3</div>
    <div id="box4"class="box">B0X #4</div><hr>
    <a href="#a link"                            >youtube  </a><br> <!--by deafault hyper links have underline-->
    <a href="#b link"style="text-decoration:none">instagram</a><br>
    <a href="#c link"                            >Facebook </a>
    <a href="#c link" id="linkkk"                >Facebook </a>
  
</body>
</html>
